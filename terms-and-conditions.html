<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0C082A" />
<title>Terms & Conditions — Faldium</title>

<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0C082A;
  --surface: #16123D;
  --text: #ECECEC;
  --muted: #9499C3;
  --accent: #D4A373;
  --border: #252152;
}

/* white flash fix */
html, body {
  background: #0C082A;
}

body {
  font-family: 'Figtree', sans-serif;
  color: var(--text);
  padding: 0 1rem 4rem;

  /* fade trick */
  opacity: 0;
  transition: opacity 0.2s ease;
}

header {
  max-width: 720px;
  margin: 0 auto;
  padding: 3rem 0 2rem;
  border-bottom: 1px solid var(--border);
  margin-bottom: 2rem;
}

h1 { font-size: 1.8rem; margin-bottom: 0.5rem; }
.meta { font-size: 0.85rem; color: var(--muted); }

.lang-switch {
  margin-top: 1rem;
  font-size: 0.9rem;
}

.lang-switch button {
  background: none;
  border: none;
  color: var(--accent);
  cursor: pointer;
  margin-right: 10px;
  opacity: 0.6;
}

.lang-switch button.active {
  opacity: 1;
  font-weight: 600;
  text-decoration: underline;
}

main { max-width: 720px; margin: 0 auto; }

section { margin-bottom: 2rem; }
h2 { font-size: 1rem; margin-bottom: 0.7rem; }
p, li { font-size: 0.95rem; line-height: 1.7; opacity: 0.9; }
p + p { margin-top: 0.6rem; }

ul { margin-left: 1rem; }

.highlight {
  background: var(--surface);
  padding: 1rem;
  border-left: 3px solid var(--accent);
  margin-top: 0.5rem;
  font-weight: 600;
}
</style>
</head>

<body>

<header>
  <h1>Terms & Conditions</h1>
  <p class="meta" id="updated"></p>

  <div class="lang-switch">
    🌐
    <button id="btn-en" onclick="setLang('en')">English</button> |
    <button id="btn-tr" onclick="setLang('tr')">Türkçe</button>
  </div>
</header>

<main id="content"></main>

<script>

const updated = {
  en: "Last Updated: November 2026",
  tr: "Son Güncelleme: Kasım 2026"
};

function setLang(lang) {
  document.getElementById("content").innerHTML = content[lang];
  document.getElementById("updated").textContent = updated[lang];

  document.getElementById("btn-en").classList.remove("active");
  document.getElementById("btn-tr").classList.remove("active");

  document.getElementById("btn-" + lang).classList.add("active");
}

// default TR
setLang('tr');

// fade-in fix
window.addEventListener("load", () => {
  document.body.style.opacity = "1";
});

</script>

</body>
</html>
